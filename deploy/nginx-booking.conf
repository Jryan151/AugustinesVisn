# nginx for the booking site: its own file, its own domain. install.sh fills in the domain and port.
# HTTPS: `sudo certbot --nginx -d book.example.com` adds the 443 part to this file by itself (DEPLOY.md step 4).
server {
    listen 80;
    listen [::]:80;
    server_name book.example.com;

    # Everything a client or Stripe sends is small; this keeps it that way.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
