# nginx for the booking site: its own file, its own domain. install.sh fills in the domain and port.
# HTTPS: `sudo certbot --nginx -d book.example.com` adds the 443 part to this file by itself (DEPLOY.md step 4).
server {
    listen 80;
    listen [::]:80;
    server_name book.example.com;

    # Photo uploads (Admin) are up to 60 MB each; the app checks every other request's size itself.
    client_max_body_size 64m;
    proxy_request_buffering off;

    # The visitor's real address (for the Admin wrong-password limit). Cloudflare's CF-Connecting-IP header is
    # believed ONLY when the request really comes from Cloudflare (its ranges, https://www.cloudflare.com/ips/);
    # anyone reaching this server directly keeps their own address, whatever header they send.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
