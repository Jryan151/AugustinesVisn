# nginx for the booking site: its own file, its own domain. install.sh fills in the domain and port.
# HTTPS: `sudo certbot --nginx -d book.example.com` adds the 443 part to this file by itself (DEPLOY.md step 4).

# A first line of defence for the public forms and the login (the app has its own, finer limits too). Per visitor
# address; a real client never comes close. The names start with booking_ so they can't clash with other sites.
limit_req_zone $binary_remote_addr zone=booking_forms:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=booking_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name book.example.com;

    # Behind Cloudflare, the visitor's real address is in CF-Connecting-IP. It's believed only when the request comes
    # from one of Cloudflare's own addresses (cloudflare.com/ips), so nobody else can fake it. Not on Cloudflare: no effect.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Photo uploads (Admin) are up to 60 MB each; the app checks every other request's size itself.
    client_max_body_size 64m;
    proxy_request_buffering off;
    limit_req_status 429;

    # The proxy settings, the same for every part of the site.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx's own view of the visitor goes last; the app trusts only that one, never what a visitor typed in front.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /api/admin/login {
        limit_req zone=booking_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }
    location ~ ^/api/(bookings|bookings/verify|requests)$ {
        limit_req zone=booking_forms burst=10 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
    }
}
