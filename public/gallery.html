<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your photos · {{BRAND}}</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#08080b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Space+Grotesk:wght@400;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav glass" aria-label="Main"><a class="brand" href="/">{{BRAND}}</a></nav>
  <main class="gallery">
    <div class="wrap">
      <div class="gallery-head">
        <div>
          <h1 class="display" id="title">Your photos</h1>
          <p class="muted" id="sub"></p>
        </div>
        <a class="btn btn-primary" id="all" href="#" hidden>Download all</a>
      </div>
      <div class="error-box" id="error" role="alert" hidden></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/gallery.js"></script>
</body>
</html>
