<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your photos · {{BRAND}}</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#08080b">
  <link rel="preload" href="/fonts/InstrumentSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav glass" aria-label="Main"><a class="brand" href="/">{{BRAND}}</a></nav>
  <main class="gallery">
    <div class="wrap">
      <div class="gallery-head">
        <div>
          <h1 class="display" id="title">Your photos</h1>
          <p class="muted" id="sub"></p>
        </div>
        <a class="btn btn-primary" id="all" href="#" hidden>Download all</a>
      </div>
      <div class="error-box" id="error" role="alert" hidden></div>
      <!-- Before the balance is paid: watermarked previews, and the way to unlock them. -->
      <div class="panel unlock" id="unlock" hidden>
        <div>
          <h2 class="unlock-title">These are previews</h2>
          <p class="muted" id="unlock-text"></p>
        </div>
        <button class="btn btn-primary" type="button" id="pay" hidden></button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/gallery.js"></script>
</body>
</html>
